[font]
size = 18
# Bold is the default weight — heavier strokes reduce ghosting/double vision (keratoconus).
normal = { family = "D2CodingLigature Nerd Font", style = "Bold" }
bold = { family = "D2CodingLigature Nerd Font", style = "Bold" }

# Extra letter (x) and line (y) spacing to fight ghosting/overlap.
[font.offset]
x = 1
y = 4

[shell]
program = "/bin/zsh"
args = ["-l", "-c", "tmux attach || tmux"]

[window]
dimensions = { columns = 180, lines = 60 }

# Gruvbox Dark Hard — high contrast without harsh pure-white-on-pure-black (avoids halation).
[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#1d2021"
foreground = "#ebdbb2"

[colors.cursor]
text = "#1d2021"
cursor = "#fabd2f"

[colors.selection]
text = "#1d2021"
background = "#fabd2f"

[colors.normal]
black = "#1d2021"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[colors.bright]
black = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#ebdbb2"
